<!doctype html>
<html lang="pt-br" data-theme="auto">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="color-scheme" content="light dark">

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">

<title>404 • Página não encontrada</title>


<style>

*, *::before, *::after{
    box-sizing:border-box;
}


html{
    scroll-behavior:smooth;
}


body{

    min-height:100dvh;

    margin:0;

    display:grid;

    place-items:center;

    background:#ffffff;

    color:#0b0f14;

    font-family:
    ui-sans-serif,
    -apple-system,
    Segoe UI,
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

    line-height:1.55;

}


:root{

    --bg:#ffffff;
    --fg:#0b0f14;
    --muted:#5b6673;
    --surface:#f6f7f9;
    --border:#e6e9ef;
    --primary:#2e7d32;

    --radius:16px;

    --shadow:
    0 10px 30px rgba(0,0,0,.06);

}


@media(prefers-color-scheme:dark){

    body{

        background:#0b0f14;
        color:#e6ebf2;

    }


    :root{

        --surface:#121923;

        --border:#1e2835;

        --muted:#9aa7b5;

        --shadow:
        0 10px 30px rgba(0,0,0,.35);

    }

}



.container{

    width:min(100% - 2rem,600px);

}


.card{

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:3rem 2rem;

    text-align:center;

    box-shadow:var(--shadow);

}



.number{

    font-size:clamp(5rem,15vw,9rem);

    font-weight:800;

    line-height:1;

    color:var(--primary);

    margin-bottom:1rem;

}



h1{

    margin:0 0 1rem;

    font-size:2rem;

}



p{

    color:var(--muted);

    margin-bottom:2rem;

}



.btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:.8rem 1.4rem;

    border-radius:999px;

    background:var(--primary);

    color:white;

    text-decoration:none;

    font-weight:600;

    transition:.2s;

}



.btn:hover{

    transform:translateY(-2px);

}



.logo{

    margin-top:2rem;

    font-size:.9rem;

    color:var(--muted);

}


</style>

</head>


<body>


<main class="container">


<section class="card">


<div class="number">

404

</div>


<h1>
Página não encontrada
</h1>


<p>

Parece que essa página saiu para explorar algum destino novo.
Ela pode ter sido removida ou o endereço pode estar incorreto.

</p>


<a class="btn" href="./">

Voltar ao início

</a>


<div class="logo">

🌿 Kenner Vasquez • Portfólio

</div>


</section>


</main>


</body>

</html>
